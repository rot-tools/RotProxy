plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

version = '1.2.1+mc26.2'
group = 'com.rotproxy'
base { archivesName = 'rotproxy' }

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.159.0+26.2'
    implementation include('io.netty:netty-codec-socks:4.2.15.Final') { transitive = false }
    implementation include('io.netty:netty-handler-proxy:4.2.15.Final') { transitive = false }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test { useJUnitPlatform() }
jar { from('LICENSE') { rename { "${it}_rotproxy" } } }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'rotproxy-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}
